name: Atualizar cobrinha de contribuicoes

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/snake.yml'
  schedule:
    - cron: '15 3 * * *'

permissions:
  contents: write

concurrency:
  group: github-snake
  cancel-in-progress: true

jobs:
  gerar-cobrinha:
    runs-on: ubuntu-latest
    steps:
      - name: Gerar cobrinha azul e ciano
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=%230284c7&color_dots=%23ebedf0,%23bae6fd,%237dd3fc,%230ea5e9,%230369a1
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%2322d3ee&color_dots=%230d1117,%230b4f71,%230284c7,%230ea5e9,%2322d3ee

      - name: Publicar animacoes na branch output
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: ./dist
          force_orphan: true
